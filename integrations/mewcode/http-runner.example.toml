server_url = "http://host.docker.internal:18044"
allow_insecure_http = true # Explicitly trust this local Docker-to-host connection.
name = "mewcode-http-runner"
state_dir = "/app/data/mewcode-http/runner"
execution_slots = 1
score_slots = 1
allowed_http_origins = ["http://127.0.0.1:19045"]
secret_env_allowlist = ["AGENT_HTTP_TOKEN"]

[python_scorers.deta_code]
entry_point = "integrations.deta.scorer:score"
import_paths = ["/app"]
cpu_seconds = 30
memory_bytes = 536870912

# New coding regression; configure frozen numeric/config before separate publication.
[python_scorers.coding_regression]
entry_point = "integrations.coding.scorer:score"
python = "/app/.venv/bin/python"
import_paths = ["/app"]
cpu_seconds = 45
memory_bytes = 536870912
file_bytes = 1048576
