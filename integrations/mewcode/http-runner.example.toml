server_url = "http://host.docker.internal:18044"
name = "mewcode-http-runner"
state_dir = "/app/data/mewcode-http/runner"
execution_slots = 1
score_slots = 1
allowed_http_origins = ["http://127.0.0.1:19045"]
secret_env_allowlist = ["AGENT_HTTP_TOKEN"]

[python_scorers.deta_code]
entry_point = "integrations.deta.scorer:score"
import_paths = ["/app"]
cpu_seconds = 30
memory_bytes = 536870912
