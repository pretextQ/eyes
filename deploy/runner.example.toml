# Copy to runner.toml in the project root, then adapt addresses and local aliases.
server_url = "http://127.0.0.1:8000"
token_env = "EYES_RUNNER_TOKEN"
name = "host-runner"
state_dir = "data/runner"
execution_slots = 1
score_slots = 1
allowed_http_origins = ["http://127.0.0.1:9000"]
secret_env_allowlist = []
max_score_input_bytes = 33554432 # Match the control API's scoring-input response limit.

# Trusted local Python integration. Paths are relative to this configuration.
