name: eyes

x-control: &control
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &environment
    EYES_DATABASE_URL: postgresql+psycopg://eyes:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/eyes
    EYES_ARTIFACT_ROOT: /app/data/artifacts
    EYES_GLOBAL_EXECUTION_LIMIT: ${EYES_GLOBAL_EXECUTION_LIMIT:-16}
    EYES_GLOBAL_SCORE_LIMIT: ${EYES_GLOBAL_SCORE_LIMIT:-4}
    EYES_SCORE_SUBMISSION_GRACE_SECONDS: ${EYES_SCORE_SUBMISSION_GRACE_SECONDS:-60}
    EYES_MAX_SCORE_INPUT_BYTES: ${EYES_MAX_SCORE_INPUT_BYTES:-33554432}
  volumes:
    - artifacts:/app/data/artifacts

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: eyes
      POSTGRES_USER: eyes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyes -d eyes"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *control
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *control
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *control
    command: ["eyes-scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
  artifacts:
